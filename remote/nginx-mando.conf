# mando.local -> mando de la tele (127.0.0.1:8787). Solo atiende a ese nombre; el resto del servidor no cambia.
map $http_upgrade $mando_conn { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name mando.local;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mando_conn;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
