# Plantilla de nginx: http://@MDNS_NAME@ (puerto 80) -> servidor del mando (127.0.0.1:@PORT@).
# scripts/install.sh la rellena con TV_MDNS_NAME y TV_PORT en ~/.config/jota-screen/generated/nginx-mando.conf
# y enseña los comandos sudo para instalarla. Solo atiende a ese nombre; el resto del nginx no cambia.
# Sin este proxy el mando se abre igual en http://<nombre>:@PORT@.
map $http_upgrade $mando_conn { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name @MDNS_NAME@;
    access_log off; # las URLs del mando llevan el token del dispositivo (?t=): no se registran

    location / {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $mando_conn;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
