<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presentación</title><link rel="stylesheet" href="/stage.css">
<style>
#st{position:fixed;inset:0}
.sl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:8vh 9vw;gap:2.4vh;opacity:0;pointer-events:none}
.sl.on{opacity:1;pointer-events:auto}
.sl.on .a{animation:rise .7s var(--ease) both}
.sl.on .a:nth-child(2){animation-delay:.12s}.sl.on .a:nth-child(3){animation-delay:.24s}
.sl.on .b{animation:rise .6s var(--ease) both}
.k{font-size:clamp(15px,1.6vw,22px);letter-spacing:.2em;text-transform:uppercase;color:var(--acc);font-weight:600}
h1{font-size:clamp(40px,6.2vw,90px);font-weight:770;letter-spacing:-.028em;line-height:1.04;max-width:82vw}
h2{font-size:clamp(22px,2.7vw,40px);font-weight:450;color:var(--mut);max-width:70vw;line-height:1.3}
.big{font-size:clamp(70px,16vw,240px);font-weight:800;letter-spacing:-.04em;line-height:.95;background:linear-gradient(135deg,var(--fg),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
ul{list-style:none;display:flex;flex-direction:column;gap:1.6vh;margin-top:1vh}
li{font-size:clamp(22px,3vw,44px);font-weight:520;display:flex;gap:1.4vw;align-items:baseline}
li::before{content:"";flex:none;width:.5em;height:.5em;border-radius:50%;background:var(--acc);transform:translateY(-.08em)}
.img{max-height:46vh;max-width:70vw;border-radius:22px;object-fit:contain;box-shadow:0 20px 70px rgba(0,0,0,.5)}
.html{font-size:clamp(20px,2.4vw,34px)}
.dots{position:fixed;bottom:3.4vh;left:0;right:0;display:flex;justify-content:center;gap:10px}
.dots i{width:9px;height:9px;border-radius:9px;background:var(--line);transition:all .4s var(--ease)}
.dots i.on{width:34px;background:var(--acc)}
.pg{position:fixed;bottom:3vh;right:4vw;font-size:clamp(13px,1.3vw,18px);color:var(--mut)}
.prog{position:fixed;top:0;left:0;height:3px;background:var(--acc);width:0}
</style></head><body>
<div id="st"></div><div class="dots" id="d"></div><div class="pg" id="pg"></div><div class="prog" id="pr"></div>
<script src="/tv-stage.js"></script>
<script>
let data=null,idx=0,timer=null,rendered='';
const $=id=>document.getElementById(id);
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;};
function build(){
  const st=$('st');st.textContent='';
  (data.slides||[]).forEach(s=>{
    const d=el('section','sl');
    if(s.kicker)d.appendChild(el('div','k a',s.kicker));
    if(s.big!=null)d.appendChild(el('div','big a',s.big));
    if(s.title)d.appendChild(el('h1','a',s.title));
    if(s.subtitle)d.appendChild(el('h2','a',s.subtitle));
    if(Array.isArray(s.bullets)&&s.bullets.length){const u=el('ul');s.bullets.forEach((b,i)=>{const l=el('li','b',b);l.style.animationDelay=(.3+i*.15)+'s';u.appendChild(l);});d.appendChild(u);}
    if(s.image){const im=el('img','img a');im.src=s.image;d.appendChild(im);}
    if(s.html){const h=el('div','html a');h.innerHTML=s.html;d.appendChild(h);}
    st.appendChild(d);
  });
  $('d').textContent='';(data.slides||[]).forEach(()=>$('d').appendChild(el('i')));
}
function go(n){
  const L=(data.slides||[]).length;if(!L)return;
  idx=((n%L)+L)%L;
  [...$('st').children].forEach((e,i)=>e.classList.toggle('on',i===idx));
  [...$('d').children].forEach((e,i)=>e.classList.toggle('on',i===idx));
  $('pg').textContent=(idx+1)+' / '+L;
  clearTimeout(timer);
  const sec=Number(data.autoplay)||0;
  const pr=$('pr');pr.style.transition='none';pr.style.width='0';
  if(sec>0){requestAnimationFrame(()=>{pr.style.transition='width '+sec+'s linear';pr.style.width='100%';});timer=setTimeout(()=>go(idx+1),sec*1000);}
  tv.emit('slide',{index:idx});
}
tv.onData(d=>{
  const sig=JSON.stringify(d.slides||[]);
  const first=!data;data=d;
  if(sig!==rendered){rendered=sig;build();}
  document.title=d.title||'Presentación';
  go(Number.isInteger(d.index)?d.index:(first?0:idx));
});
addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key))go(idx+1);
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key))go(idx-1);
});
addEventListener('click',()=>go(idx+1));
addEventListener('contextmenu',e=>{e.preventDefault();go(idx-1);});
</script></body></html>
