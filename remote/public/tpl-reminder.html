<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recordatorio</title><link rel="stylesheet" href="/stage.css">
<style>
main{height:100%;display:grid;place-items:center;text-align:center;padding:6vh 8vw}
.wrap{display:flex;flex-direction:column;align-items:center;gap:3vh;max-width:78vw}
.ring{position:relative;width:clamp(90px,11vw,150px);aspect-ratio:1;display:grid;place-items:center}
.ring::before,.ring::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--acc);animation:pulse 2.4s var(--ease) infinite}
.ring::after{animation-delay:1.2s}
.ic{font-size:clamp(48px,6vw,86px);animation:pop .6s var(--ease) both;line-height:1}
.k{font-size:clamp(15px,1.6vw,22px);letter-spacing:.2em;text-transform:uppercase;color:var(--acc);font-weight:600;animation:fade .6s .15s both}
h1{font-size:clamp(40px,6.4vw,92px);font-weight:760;letter-spacing:-.025em;line-height:1.05;animation:rise .6s .2s var(--ease) both}
p{font-size:clamp(20px,2.6vw,38px);color:var(--mut);line-height:1.3;animation:rise .6s .32s var(--ease) both}
.time{font-size:clamp(18px,2vw,28px);color:var(--warn);font-weight:650;animation:rise .6s .42s var(--ease) both}
.hint{position:fixed;bottom:3.5vh;font-size:clamp(13px,1.2vw,17px);color:var(--mut);opacity:.7}
</style></head><body>
<main><div class="wrap"><div class="ring"><div class="ic" id="i"></div></div>
<div class="k" id="k"></div><h1 id="t"></h1><p id="x"></p><div class="time" id="m"></div></div>
<div class="hint">Esc para cerrar</div></main>
<script src="/tv-stage.js"></script>
<script>
const $=id=>document.getElementById(id);
tv.onData(d=>{
  $('i').textContent=d.icon||'⏰';
  $('k').textContent=d.kicker||'Recordatorio';
  $('t').textContent=d.title||'';
  $('x').textContent=d.text||'';
  $('m').textContent=d.time||'';
  document.title=d.title||'Recordatorio';
});
</script></body></html>
