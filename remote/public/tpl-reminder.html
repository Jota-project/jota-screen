<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recordatorio</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/stage.css">
<style>
main{height:100%;display:grid;place-items:center;text-align:center;padding:6vh 8vw}
.wrap{display:flex;flex-direction:column;align-items:center;gap:3vh;max-width:78vw}
.ring{position:relative;width:calc(150 * var(--u));aspect-ratio:1;display:grid;place-items:center}
.ring::before,.ring::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--acc);animation:pulse 2.4s var(--ease) infinite}
.ring::after{animation-delay:1.2s}
.ic{font-size:calc(86 * var(--u));animation:pop .6s var(--ease) both;line-height:1}
.k{font-size:calc(22 * var(--u));letter-spacing:.2em;text-transform:uppercase;color:var(--acc);animation:fade .6s .15s both}
h1{font-size:calc(92 * var(--u));line-height:1.05;animation:rise .6s .2s var(--ease) both}
p{font-size:calc(38 * var(--u));color:var(--mut);line-height:1.3;animation:rise .6s .32s var(--ease) both}
.time{font-size:calc(28 * var(--u));color:var(--warn);animation:rise .6s .42s var(--ease) both}
.hint{position:fixed;bottom:3.5vh;font-size:calc(17 * var(--u));color:var(--mut);opacity:.7}
</style></head><body>
<main><div class="wrap"><div class="ring"><div class="ic" id="i"></div></div>
<div class="k" id="k"></div><h1 id="t"></h1><p id="x"></p><div class="time" id="m"></div></div>
<div class="hint">Esc para cerrar</div></main>
<script src="/tv-stage.js"></script>
<script>
const $=id=>document.getElementById(id);
tv.onData(d=>{
  $('i').textContent=d.icon||'⏰';
  $('k').textContent=d.kicker||'Recordatorio';
  $('t').textContent=d.title||'';
  $('x').textContent=d.text||'';
  $('m').textContent=d.time||'';
  document.title=d.title||'Recordatorio';
});
</script></body></html>
